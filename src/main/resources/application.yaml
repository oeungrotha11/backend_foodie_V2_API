spring:
  application:
    name: foodie-api
  datasource:
    url: jdbc:postgresql://localhost:5432/foodie_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  web:
    error:
      include-stacktrace: never

app:
  upload:
    dir: uploads
  jwt:
    access-expiration: 9000000
    refresh-expiration: 604800000
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-bytes}

payway:
  base-url: ${PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
  merchant-id: ${PAYWAY_MERCHANT_ID:}
  api-key: ${PAYWAY_API_KEY:}
  currency: ${PAYWAY_CURRENCY:USD}
  payment-option: ${PAYWAY_PAYMENT_OPTION:abapay_khqr}

server:
  port: 8080
